<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unify Studio 0.5.6</title>
    <style>
      :root {
        --explorer-width: 250px;
        --editor-width: 48%;
        --topbar: 64px;
        --statusbar: 28px;
        --panel: #111827;
        --panel-2: #0f172a;
        --panel-3: #0b1220;
        --border: #263247;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --accent: #38bdf8;
        --accent-2: #818cf8;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #070b14;
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        user-select: none;
      }

      .studio {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: var(--topbar) 1fr var(--statusbar);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        background: linear-gradient(180deg, #121a2b, #0f1728);
        border-bottom: 1px solid var(--border);
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        color: white;
        font-weight: 900;
        box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
        flex: 0 0 38px;
      }
      .brand-title {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
      }
      .brand-subtitle {
        margin: 2px 0 0;
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tool-btn {
        border: 1px solid #334155;
        color: #dbeafe;
        background: #111827;
        padding: 8px 11px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .tool-btn:hover {
        background: #172033;
      }
      .tool-btn.primary {
        border-color: #10b981;
        background: linear-gradient(135deg, #059669, #14b8a6);
        color: white;
      }
      .tool-btn.code {
        border-color: #4f46e5;
      }

      .workspace {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--explorer-width) 6px minmax(
            300px,
            var(--editor-width)
          ) 6px minmax(320px, 1fr);
      }

      .explorer {
        min-width: 0;
        min-height: 0;
        background: #0b1220;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .explorer-head,
      .panel-head {
        height: 40px;
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        background: #141c2d;
        border-bottom: 1px solid var(--border);
        color: #94a3b8;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }
      .explorer-actions {
        display: flex;
        gap: 4px;
      }
      .mini-btn {
        width: 27px;
        height: 25px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #111827;
        color: #cbd5e1;
        cursor: pointer;
        font-size: 12px;
      }
      .mini-btn:hover {
        background: #172033;
      }
      .tree {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px;
      }
      .tree-file {
        width: 100%;
        border: 0;
        background: transparent;
        color: #cbd5e1;
        text-align: left;
        padding: 8px 9px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
      }
      .tree-file:hover {
        background: #172033;
      }
      .tree-file.active {
        background: #0c4a6e;
        color: #e0f2fe;
      }
      .tree-folder {
        color: #93c5fd;
        padding: 8px 9px;
        font-size: 12px;
      }
      .tree-empty {
        padding: 12px 9px;
        color: #64748b;
        font-size: 11px;
        line-height: 1.5;
      }

      .resize-handle {
        background: #111827;
        position: relative;
        cursor: col-resize;
      }
      .resize-handle:hover,
      .resize-handle.dragging {
        background: #0ea5e9;
      }
      .resize-handle::before {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 50%;
        height: 42px;
        transform: translateY(-50%);
        background: repeating-linear-gradient(
          to bottom,
          #475569 0 2px,
          transparent 2px 6px
        );
        opacity: 0.65;
      }

      .editor-panel,
      .preview-panel {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .editor-panel {
        background: #090f1c;
      }
      .preview-panel {
        background: #020617;
      }

      .tabs {
        height: 35px;
        flex: 0 0 35px;
        display: flex;
        align-items: stretch;
        overflow-x: auto;
        background: #0b1220;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        min-width: 110px;
        max-width: 180px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 9px;
        border-right: 1px solid var(--border);
        color: #94a3b8;
        background: #0b1220;
        cursor: pointer;
        font-size: 11px;
      }
      .tab.active {
        color: #e0f2fe;
        background: #101a2c;
      }
      .tab-close {
        color: #64748b;
        cursor: pointer;
      }
      .tab-close:hover {
        color: #fff;
      }

      .editor-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
      }
      .line-numbers {
        overflow: hidden;
        height: 100%;
        margin: 0;
        padding: 18px 8px 18px 0;
        text-align: right;
        background: #080d17;
        border-right: 1px solid #1f2937;
        color: #475569;
        font-family: Consolas, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.7;
        user-select: none;
        white-space: pre;
      }
      #editor {
        width: 100%;
        height: 100%;
        resize: none;
        outline: none;
        border: 0;
        padding: 18px;
        background: #080d17;
        color: #bae6fd;
        font-family: Consolas, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.7;
        tab-size: 2;
        overflow: auto;
      }
      #editor::selection {
        background: rgba(56, 189, 248, 0.18);
      }

      .editor-footer {
        height: 26px;
        flex: 0 0 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 9px;
        background: #0b1220;
        border-top: 1px solid var(--border);
        color: #64748b;
        font-size: 10px;
      }

      .preview-head {
        gap: 8px;
      }
      .preview-meta {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .badge {
        padding: 3px 8px;
        border: 1px solid #075985;
        border-radius: 999px;
        background: #082f49;
        color: #38bdf8;
        font-size: 9px;
        text-transform: none;
        letter-spacing: 0.03em;
      }
      .preview-tools {
        display: flex;
        gap: 5px;
      }
      .preview-tool {
        border: 1px solid #334155;
        background: #0f172a;
        color: #cbd5e1;
        border-radius: 6px;
        padding: 4px 7px;
        font-size: 10px;
        cursor: pointer;
      }
      .preview-tool:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .preview-area {
        flex: 1;
        min-height: 0;
        padding: 10px;
        display: flex;
      }
      #previewRoot {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: auto;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 11px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .preview-page {
        width: 100%;
        min-height: 100%;
        padding: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f8fafc;
      }
      .u-container {
        width: min(100%, 960px);
        min-height: 100px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
      }
      .u-card {
        width: min(100%, 640px);
        margin-inline: auto;
        padding: 28px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 14px 38px rgba(15, 23, 42, 0.12);
      }
      .u-heading {
        margin: 0;
        width: 100%;
        font-size: 36px;
        line-height: 1.15;
        font-weight: 800;
        text-align: center;
        color: #0f172a;
      }
      .u-text,
      .u-paragraph {
        width: 100%;
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        color: #334155;
      }
      .u-button {
        width: max-content;
        max-width: 100%;
        min-height: 46px;
        padding: 12px 21px;
        border: 0;
        border-radius: 12px;
        background: #3b82f6;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.18s ease;
        box-shadow: 0 8px 18px rgba(59, 130, 246, 0.18);
      }
      .u-input {
        width: 100%;
        min-height: 46px;
        padding: 11px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
        color: #0f172a;
        outline: none;
      }
      .u-input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
      }
      .u-link {
        color: #2563eb;
        font-weight: 700;
        text-decoration: underline;
        cursor: pointer;
      }
      .u-image {
        width: min(100%, 560px);
        min-height: 180px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
        color: #64748b;
      }
      .preview-empty {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 30px;
        color: #64748b;
        font-size: 13px;
      }
      .preview-error {
        margin: 30px auto;
        max-width: 720px;
        padding: 20px;
        background: #fff7ed;
        border: 1px solid #fdba74;
        border-radius: 12px;
        color: #9a3412;
      }
      .preview-error h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .preview-error p {
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      .diagnostics {
        max-height: 140px;
        overflow: auto;
        background: #080d17;
        border-top: 1px solid var(--border);
      }
      .diagnostic {
        padding: 7px 10px;
        font-size: 10px;
        border-bottom: 1px solid #182234;
        color: #fbbf24;
        cursor: pointer;
      }
      .diagnostic:hover {
        background: #101a2b;
      }
      .diagnostic.ok {
        color: #86efac;
      }

      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        background: #0b1220;
        border-top: 1px solid var(--border);
        color: #64748b;
        font-size: 10px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(5px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .modal-backdrop.open {
        display: flex;
      }
      .modal {
        width: min(1100px, 96vw);
        height: min(760px, 90vh);
        display: flex;
        flex-direction: column;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
      }
      .modal-head {
        height: 48px;
        flex: 0 0 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #111827;
        border-bottom: 1px solid var(--border);
      }
      .modal-title {
        font-size: 13px;
        font-weight: 800;
      }
      .modal-tabs {
        display: flex;
        gap: 5px;
      }
      .code-tab {
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0b1220;
        color: #94a3b8;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 10px;
      }
      .code-tab.active {
        background: #0c4a6e;
        border-color: #0ea5e9;
        color: #e0f2fe;
      }
      #generatedCode {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 16px;
        background: #080d17;
        color: #c4b5fd;
        font:
          12px/1.65 Consolas,
          "Courier New",
          monospace;
        white-space: pre;
      }
      .modal-foot {
        height: 44px;
        flex: 0 0 44px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        background: #111827;
        border-top: 1px solid var(--border);
      }

      .rename-backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(2, 6, 23, 0.62);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .rename-backdrop.open {
        display: flex;
      }
      .rename-box {
        width: min(420px, 92vw);
        padding: 18px;
        background: #111827;
        border: 1px solid #334155;
        border-radius: 12px;
      }
      .rename-box h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      #renameInput {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #080d17;
        color: #e2e8f0;
        outline: none;
      }
      .rename-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 12px;
      }

      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: 190px 5px minmax(260px, 1fr);
          grid-template-rows: 1fr 1fr;
        }
        .preview-panel {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .editor-panel {
          grid-column: 3;
          grid-row: 1;
        }
        .workspace > .editor-resize {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="studio" class="studio">
      <header class="topbar">
        <div class="brand">
          <div class="logo">U</div>
          <div>
            <div class="brand-title">Unify Studio 0.5.6</div>
            <div class="brand-subtitle">Human-intent programming IDE</div>
          </div>
        </div>

        <div class="toolbar">
          <button id="openProject" class="tool-btn" type="button">
            Open Project
          </button>
          <button id="newFile" class="tool-btn" type="button">New File</button>
          <button id="renameFile" class="tool-btn" type="button">Rename</button>
          <button id="saveFile" class="tool-btn" type="button">Save</button>
          <button id="runPreview" class="tool-btn primary" type="button">
            ▶ Run Preview
          </button>
          <button id="viewCode" class="tool-btn code" type="button">
            &lt;/&gt; View Code
          </button>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <aside class="explorer">
          <div class="explorer-head">
            <span>Explorer</span>
            <div class="explorer-actions">
              <button
                id="refreshTree"
                class="mini-btn"
                type="button"
                title="Refresh"
              >
                ↻
              </button>
            </div>
          </div>
          <div id="projectName" class="tree-folder">📁 unify-project</div>
          <div id="tree" class="tree"></div>
        </aside>

        <div
          id="explorerResize"
          class="resize-handle"
          title="Resize Explorer"
        ></div>

        <section class="editor-panel">
          <div id="tabs" class="tabs"></div>
          <div class="editor-wrap">
            <pre id="lineNumbers" class="line-numbers">1</pre>
            <textarea
              id="editor"
              spellcheck="false"
              wrap="off"
              aria-label="Unify editor"
            ></textarea>
          </div>
          <div class="editor-footer">
            <span id="statusFile">main.uni</span>
            <span id="lineInfo">Ln 1, Col 1</span>
          </div>
        </section>

        <div
          id="editorResize"
          class="resize-handle"
          title="Resize Editor"
        ></div>

        <section class="preview-panel">
          <div class="panel-head preview-head">
            <div class="preview-meta">
              <span>Live Preview</span>
              <span id="statusBadge" class="badge">Ready</span>
            </div>
            <div class="preview-tools">
              <button
                id="previewBack"
                class="preview-tool"
                type="button"
                disabled
              >
                ← Back
              </button>
              <button id="previewHome" class="preview-tool" type="button">
                ⌂ Home
              </button>
            </div>
          </div>
          <div class="preview-area">
            <div id="previewRoot"></div>
          </div>
          <div id="diagnostics" class="diagnostics"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="statusState">Ready</span>
        <span id="contextInfo">Human intent mode</span>
      </footer>
    </div>

    <input
      id="folderInput"
      type="file"
      webkitdirectory
      directory
      multiple
      hidden
    />

    <div id="codeModal" class="modal-backdrop">
      <div class="modal">
        <div class="modal-head">
          <div class="modal-title">Generated Implementation</div>
          <div class="modal-tabs">
            <button class="code-tab active" data-code-tab="html" type="button">
              HTML
            </button>
            <button class="code-tab" data-code-tab="css" type="button">
              CSS
            </button>
            <button class="code-tab" data-code-tab="javascript" type="button">
              JavaScript
            </button>
          </div>
        </div>
        <pre id="generatedCode"></pre>
        <div class="modal-foot">
          <button id="copyCode" class="tool-btn" type="button">Copy</button>
          <button id="closeCode" class="tool-btn" type="button">Close</button>
        </div>
      </div>
    </div>

    <div id="renameModal" class="rename-backdrop">
      <div class="rename-box">
        <h3>Rename Unify file</h3>
        <input id="renameInput" type="text" spellcheck="false" />
        <div class="rename-actions">
          <button id="cancelRename" class="tool-btn" type="button">
            Cancel
          </button>
          <button id="confirmRename" class="tool-btn primary" type="button">
            Rename
          </button>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      /* =======================================================
       DOM REFERENCES
       ======================================================= */
      var studio = document.getElementById("studio");
      var workspace = document.getElementById("workspace");
      var editor = document.getElementById("editor");
      var lineNumbers = document.getElementById("lineNumbers");
      var lineInfo = document.getElementById("lineInfo");
      var tree = document.getElementById("tree");
      var tabs = document.getElementById("tabs");
      var previewRoot = document.getElementById("previewRoot");
      var statusBadge = document.getElementById("statusBadge");
      var statusState = document.getElementById("statusState");
      var contextInfo = document.getElementById("contextInfo");
      var statusFile = document.getElementById("statusFile");
      var projectName = document.getElementById("projectName");
      var diagnostics = document.getElementById("diagnostics");
      var codeModal = document.getElementById("codeModal");
      var generatedCode = document.getElementById("generatedCode");
      var renameModal = document.getElementById("renameModal");
      var renameInput = document.getElementById("renameInput");
      var folderInput = document.getElementById("folderInput");

      var project = {
        name: "unify-project",
        files: Object.create(null),
        current: "main.uni",
        rootFile: "main.uni",
        handles: Object.create(null),
        directoryHandle: null,
        previewCurrent: "main.uni",
        previewHistory: [],
        filesOrder: [],
      };

      var nodeCounter = 0;
      var renderQueued = false;
      var codeCache = { html: "", css: "", javascript: "" };
      var activeCodeTab = "html";
      var currentCompiled = null;
      var renameTarget = null;
      var currentPreviewPath = "main.uni";

      project.files["main.uni"] = {
        name: "main.uni",
        content:
          "Create a page.\n\n" +
          "Make it feel modern and welcoming.\n\n" +
          "Give the page a calm blue background.\n\n" +
          'Put a heading in the middle saying "Welcome to Unify".\n\n' +
          'Under that put some text saying "Programming, but human.".\n\n' +
          'Create a button saying "Start Building".\n\n' +
          "Make the button big and friendly.\n\n" +
          "Give it a blue to purple gradient.\n\n" +
          "When someone hovers over the button, make it a little brighter and lift it slightly.",
      };
      project.filesOrder.push("main.uni");

      /* =======================================================
       GENERAL HELPERS
       ======================================================= */
      function lower(value) {
        return String(value == null ? "" : value).toLowerCase();
      }
      function stripPeriod(value) {
        return String(value == null ? "" : value)
          .trim()
          .replace(/[.!?]+$/, "")
          .trim();

      function hexToRgb(hex) {
        var value = String(hex).replace("#", "");

              ");refresh();});",
          );
        else if (a.type === "setVariable")
          js.push(
            "document.querySelector(" +
              jsString(sel) +
              ").addEventListener('click',function(){if(!state[" +
              jsString(a.variable) +
              "]){throw new Error('Missing variable');}state[" +
              jsString(a.variable) +
              "].value=" +
              (/^-?\d+(?:\.\d+)?$/.test(stripPeriod(a.rawValue))
                ? stripPeriod(a.rawValue)
                : jsString(stripPeriod(a.rawValue))) +
              ";refresh();});",
          );
      }
      function generateCode(compiled, path) {
        var css = [
          "/* Generated by Unify 0.5.6 from " + path + " */",
          "*{box-sizing:border-box}",
          "html,body{margin:0;width:100%;min-height:100%}",
          "body{margin:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif}",
          ".preview-page{width:100%;min-height:100vh;padding:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}",
          ".u-card{width:min(100%,640px);margin-inline:auto;padding:28px;display:flex;flex-direction:column;gap:16px;border-radius:18px;background:#fff;box-shadow:0 14px 38px rgba(15,23,42,.12)}",
          ".u-button{width:max-content;min-height:46px;padding:12px 21px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer}",
          ".u-input{width:100%;min-height:46px;padding:11px 14px;border:1px solid #cbd5e1;border-radius:10px}",
        ];
        var js = [
          '"use strict";',
          "const state=" + JSON.stringify(compiled.variables || {}) + ";",
          "function interpolate(t){return String(t).replace(/\\{([A-Za-z_][A-Za-z0-9_]*)\\}/g,(m,n)=>state[n]?String(state[n].value):m);}",
          "function refresh(){document.querySelectorAll('[data-unify-bind]').forEach(e=>{e.textContent=interpolate(e.dataset.unifyBind);});}",
        ];
        var nodes = allNodes(compiled.root);
        nodes.forEach(function (n) {
          cssForNode(n, css);
        });
        function htmlWithBinding(n) {
          return htmlForNode(n);
        }
        nodes.forEach(function (n) {
          (n.actions || []).forEach(function (a) {
            jsForAction(n, a, js);
          });
          if (n.navigation) {
            jsForAction(
              n,
              {
                type: "navigate",
                target: n.navigation.target,
                external: n.navigation.external,
              },
              js,
            );
          }
        });
        js.push("refresh();");
        var html =
          '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Unify Output</title>\n<style>\n' +
          css.join("\n") +
          "\n</style>\n</head>\n<body>\n" +
          (compiled.page
            ? htmlWithBinding(compiled.page)
            : (compiled.root.children || []).map(htmlWithBinding).join("\n")) +
          "\n<script>\n" +
          js.join("\n") +
          "\n<\\/script>\n</body>\n</html>";
        return { html: html, css: css.join("\n"), javascript: js.join("\n") };
      }

      /* =======================================================
       IDE PROJECT SYSTEM
       ======================================================= */
      function renderTree() {
        tree.innerHTML = "";
        if (!project.filesOrder.length) {
          tree.innerHTML =
            '<div class="tree-empty">No .uni files yet.<br>Create one or open a project folder.</div>';
          return;
        }
        project.filesOrder.forEach(function (path) {
          if (!project.files[path]) return;
          var b = document.createElement("button");
          b.className =
            "tree-file" + (path === project.current ? " active" : "");
          b.type = "button";
          b.textContent = "📄 " + path;
          b.addEventListener("click", function () {
            switchFile(path);
          });
          tree.appendChild(b);
        });
      }
      function renderTabs() {
        tabs.innerHTML = "";
        project.filesOrder.forEach(function (path) {
          if (!project.files[path]) return;
          var tab = document.createElement("div");
          tab.className = "tab" + (path === project.current ? " active" : "");
          var label = document.createElement("span");
          label.textContent = path;
          var close = document.createElement("span");
          close.className = "tab-close";
          close.textContent = "×";
          close.addEventListener("click", function (e) {
            e.stopPropagation();
            closeFile(path);
          });
          tab.appendChild(label);
          tab.appendChild(close);
          tab.addEventListener("click", function () {
            switchFile(path);
          });
          tabs.appendChild(tab);
        });
      }
      function saveCurrentBuffer() {
        if (project.files[project.current])
          project.files[project.current].content = editor.value;
      }
      function switchFile(path) {
        if (!project.files[path]) return;
        saveCurrentBuffer();
        project.current = path;
        editor.value = project.files[path].content;
        statusFile.textContent = path;
        updateLineNumbers();
        updateCursorInfo();
        renderTree();
        renderTabs();
        compileCurrent();
      }
      function closeFile(path) {
        if (path === project.rootFile && project.filesOrder.length > 1)
          project.rootFile =
            project.filesOrder.find(function (x) {
              return x !== path;
            }) || project.rootFile;
        delete project.files[path];
        project.filesOrder = project.filesOrder.filter(function (x) {
          return x !== path;
        });
        if (!project.filesOrder.length) {
          project.files["main.uni"] = {
            name: "main.uni",
            content: "Create a page.",
          };
          project.filesOrder.push("main.uni");
          project.rootFile = "main.uni";
        }
        if (project.current === path) project.current = project.filesOrder[0];
        editor.value = project.files[project.current].content;
        statusFile.textContent = project.current;
        renderTree();
        renderTabs();
        updateLineNumbers();
        updateCursorInfo();
        compileCurrent();
      }
      function addNewFile() {
        saveCurrentBuffer();
        var base = "new-page.uni",
          index = 1,
          name = base;
        while (project.files[name]) {
          name = "new-page-" + index++ + ".uni";
        }
        project.files[name] = { name: name, content: "Create a page.\n\n" };
        project.filesOrder.push(name);
        switchFile(name);
        renameTarget = name;
        openRename();
      }
      function openRename() {
        if (!renameTarget) renameTarget = project.current;
        renameInput.value = renameTarget;
        renameModal.classList.add("open");
        setTimeout(function () {
          renameInput.focus();
          renameInput.select();
        }, 20);
      }
      function confirmRenameNow() {
        var old = renameTarget;
        if (!old || !project.files[old]) {
          renameModal.classList.remove("open");
          return;
        }
        var value = renameInput.value.trim();
        if (!value) {
          return;
        }
        if (!/\.uni$/i.test(value)) value += ".uni";
        value = value.replace(/^\\+|\\+$/g, "");
        if (value === old) {
          renameModal.classList.remove("open");
          return;
        }
        if (project.files[value]) {
          alert("A file with that name already exists.");
          return;
        }
        saveCurrentBuffer();
        project.files[value] = project.files[old];
        project.files[value].name = value;
        delete project.files[old];
        project.filesOrder = project.filesOrder.map(function (x) {
          return x === old ? value : x;
        });
        Object.keys(project.files).forEach(function (path) {
          project.files[path].content = project.files[path].content.replace(
            new RegExp('\\"' + escapeRegExp(old) + '\\"', "g"),
            '\\"' + value + '\\"',
          );
        });
        if (project.current === old) project.current = value;
        if (project.rootFile === old) project.rootFile = value;
        renameTarget = null;
        renameModal.classList.remove("open");
        statusFile.textContent = project.current;
        renderTree();
        renderTabs();
        editor.value = project.files[project.current].content;
        updateLineNumbers();
        compileCurrent();
      }
      function escapeRegExp(v) {
        return String(v).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      async function openFolder() {
        if (window.showDirectoryPicker) {
          try {
            var handle = await window.showDirectoryPicker();
            project.directoryHandle = handle;
            project.name = handle.name || "unify-project";
            project.files = Object.create(null);
            project.filesOrder = [];
            for await (var entry of handle.values()) {
              if (entry.kind !== "file" || !/\.uni$/i.test(entry.name))
                continue;
              var file = await entry.getFile();
              project.files[entry.name] = {
                name: entry.name,
                content: await file.text(),
              };
              project.filesOrder.push(entry.name);
              project.handles[entry.name] = entry;
            }
            project.filesOrder.sort();
            project.rootFile = project.files["main.uni"]
              ? "main.uni"
              : project.filesOrder[0] || "main.uni";
            if (!project.files[project.rootFile]) {
              project.files[project.rootFile] = {
                name: project.rootFile,
                content: "Create a page.",
              };
              project.filesOrder.push(project.rootFile);
            }
            project.current = project.rootFile;
            project.previewCurrent = project.rootFile;
            currentPreviewPath = project.rootFile;
            projectName.textContent = "📁 " + project.name;
            switchFile(project.rootFile);
            return;
          } catch (e) {
            if (e && e.name !== "AbortError") console.error(e);
          }
        }
        folderInput.value = "";
        folderInput.click();
      }
      folderInput.addEventListener("change", async function () {
        var files = Array.from(folderInput.files || []);
        if (!files.length) return;
        project.name =
          (files[0].webkitRelativePath || files[0].name).split("/")[0] ||
          "unify-project";
        project.files = Object.create(null);
        project.filesOrder = [];
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          if (!/\.uni$/i.test(f.name)) continue;
          var path =
            f.webkitRelativePath.split("/").slice(1).join("/") || f.name;
          if (path.indexOf("/") !== -1) continue;
          project.files[path] = { name: path, content: await f.text() };
          project.filesOrder.push(path);
        }
        project.filesOrder.sort();
        project.rootFile = project.files["main.uni"]
          ? "main.uni"
          : project.filesOrder[0] || "main.uni";
        if (!project.files[project.rootFile]) {
          project.files[project.rootFile] = {
            name: project.rootFile,
            content: "Create a page.",
          };
          project.filesOrder.push(project.rootFile);
        }
        project.current = project.rootFile;
        projectName.textContent = "📁 " + project.name;
        switchFile(project.rootFile);
      });

      async function saveProjectFile() {
        saveCurrentBuffer();
        if (project.directoryHandle && project.handles[project.current]) {
          try {
            var writable =
              await project.handles[project.current].createWritable();
            await writable.write(project.files[project.current].content);
            await writable.close();
            statusState.textContent = "Saved";
            return;
          } catch (e) {
            console.error(e);
          }
        }
        var blob = new Blob([project.files[project.current].content], {
          type: "text/plain;charset=utf-8",
        });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = project.current;
        a.click();
        URL.revokeObjectURL(a.href);
        statusState.textContent = "Downloaded " + project.current;
      }

      /* =======================================================
       EDITOR
       ======================================================= */
      function updateLineNumbers() {
        var cs = getComputedStyle(editor),
          lh = parseFloat(cs.lineHeight);
        if (!Number.isFinite(lh)) lh = 22;
        lineNumbers.style.fontFamily = cs.fontFamily;
        lineNumbers.style.fontSize = cs.fontSize;
        lineNumbers.style.lineHeight = lh + "px";
        lineNumbers.style.paddingTop = cs.paddingTop;
        lineNumbers.style.paddingBottom = cs.paddingBottom;
        lineNumbers.scrollTop = editor.scrollTop;
        var count = Math.max(1, editor.value.split(/\r?\n/).length),
          out = [];
        for (var i = 1; i <= count; i++) out.push(String(i));
        lineNumbers.textContent = out.join("\n");
      }
      function updateCursorInfo() {
        var pos = editor.selectionStart || 0,
          before = editor.value.slice(0, pos),
          line = before.split("\n").length,
          col = pos - before.lastIndexOf("\n") - 1;
        lineInfo.textContent = "Ln " + line + ", Col " + col;
      }
      editor.addEventListener("scroll", function () {
        lineNumbers.scrollTop = editor.scrollTop;
      });
      editor.addEventListener("keyup", updateCursorInfo);
      editor.addEventListener("click", updateCursorInfo);
      editor.addEventListener("select", updateCursorInfo);
      editor.addEventListener("input", function () {
        saveCurrentBuffer();
        updateLineNumbers();
        updateCursorInfo();
        scheduleCompile();
      });
      editor.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          compileCurrent();
        }
        if (e.key === "Tab") {
          e.preventDefault();
          var s = editor.selectionStart,
            e2 = editor.selectionEnd;
          editor.value =
            editor.value.slice(0, s) + "  " + editor.value.slice(e2);
          editor.selectionStart = editor.selectionEnd = s + 2;
          saveCurrentBuffer();
          updateLineNumbers();
        }
      });

      function scheduleCompile() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(function () {
          renderQueued = false;
          compileCurrent();
        });
      }
      function compileCurrent() {
        saveCurrentBuffer();
        renderPreviewPath(project.current);
      }

      /* =======================================================
       VIEW CODE
       ======================================================= */
      function updateCodeModal() {
        var value = codeCache[activeCodeTab] || "";
        generatedCode.textContent = value;
        document.querySelectorAll("[data-code-tab]").forEach(function (b) {
          b.classList.toggle(
            "active",
            b.getAttribute("data-code-tab") === activeCodeTab,
          );
        });
      }
      document.querySelectorAll("[data-code-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          activeCodeTab = b.getAttribute("data-code-tab");
          updateCodeModal();
        });
      });

      /* =======================================================
       PREVIEW NAVIGATION
       ======================================================= */
      function updatePreviewNav() {
        document.getElementById("previewBack").disabled =
          project.previewHistory.length === 0;
      }
      document
        .getElementById("previewBack")
        .addEventListener("click", function () {
          var last = project.previewHistory.pop();
          if (last) {
            currentPreviewPath = last;
            renderPreviewPath(last);
          }
        });
      document
        .getElementById("previewHome")
        .addEventListener("click", function () {
          project.previewHistory = [];
          currentPreviewPath = project.rootFile;
          renderPreviewPath(project.rootFile);
        });

      /* =======================================================
       RESIZABLE PANES
       ======================================================= */
      function makeResizeHandle(handle, kind) {
        var dragging = false,
          startX = 0,
          startValue = 0;
        handle.addEventListener("pointerdown", function (e) {
          dragging = true;
          handle.classList.add("dragging");
          handle.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startValue =
            kind === "explorer"
              ? parseInt(
                  getComputedStyle(document.documentElement).getPropertyValue(
                    "--explorer-width",
                  ),
                  10,
                )
              : workspace.getBoundingClientRect().width * 0.48;
        });
        handle.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          var dx = e.clientX - startX;
          if (kind === "explorer") {
            var w = Math.max(170, Math.min(420, startValue + dx));
            document.documentElement.style.setProperty(
              "--explorer-width",
              w + "px",
            );
          } else {
            var total = workspace.getBoundingClientRect().width;
            var explorer =
              parseFloat(
                getComputedStyle(document.documentElement).getPropertyValue(
                  "--explorer-width",
                ),
              ) || 250;
            var share =
              Math.max(
                0.25,
                Math.min(
                  0.72,
                  (startValue + dx) / Math.max(300, total - explorer - 20),
                ),
              ) * 100;
            document.documentElement.style.setProperty(
              "--editor-width",
              share + "%",
            );
          }
        });
        handle.addEventListener("pointerup", function (e) {
          dragging = false;
          handle.classList.remove("dragging");
          try {
            handle.releasePointerCapture(e.pointerId);
          } catch (err) {}
          try {
            localStorage.setItem(
              "unify.explorer",
              getComputedStyle(document.documentElement).getPropertyValue(
                "--explorer-width",
              ),
            );
            localStorage.setItem(
              "unify.editor",
              getComputedStyle(document.documentElement).getPropertyValue(
                "--editor-width",
              ),
            );
          } catch (err2) {}
        });
      }
      makeResizeHandle(document.getElementById("explorerResize"), "explorer");
      makeResizeHandle(document.getElementById("editorResize"), "editor");

      /* =======================================================
       MODALS + TOOLBAR
       ======================================================= */
      document
        .getElementById("openProject")
        .addEventListener("click", openFolder);
      document.getElementById("newFile").addEventListener("click", addNewFile);
      document
        .getElementById("renameFile")
        .addEventListener("click", function () {
          renameTarget = project.current;
          openRename();
        });
      document
        .getElementById("saveFile")
        .addEventListener("click", saveProjectFile);
      document
        .getElementById("runPreview")
        .addEventListener("click", compileCurrent);
      document
        .getElementById("viewCode")
        .addEventListener("click", function () {
          updateCodeModal();
          codeModal.classList.add("open");
        });
      document
        .getElementById("closeCode")
        .addEventListener("click", function () {
          codeModal.classList.remove("open");
        });
      codeModal.addEventListener("click", function (e) {
        if (e.target === codeModal) codeModal.classList.remove("open");
      });
      document
        .getElementById("copyCode")
        .addEventListener("click", async function () {
          try {
            await navigator.clipboard.writeText(generatedCode.textContent);
            statusState.textContent = "Copied generated " + activeCodeTab + ".";
          } catch (e) {
            statusState.textContent = "Copy unavailable.";
          }
        });
      document
        .getElementById("refreshTree")
        .addEventListener("click", function () {
          renderTree();
          renderTabs();
        });
      document
        .getElementById("cancelRename")
        .addEventListener("click", function () {
          renameModal.classList.remove("open");
          renameTarget = null;
        });
      document
        .getElementById("confirmRename")
        .addEventListener("click", confirmRenameNow);
      renameModal.addEventListener("click", function (e) {
        if (e.target === renameModal) {
          renameModal.classList.remove("open");
          renameTarget = null;
        }
      });
      renameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") confirmRenameNow();
        if (e.key === "Escape") {
          renameModal.classList.remove("open");
          renameTarget = null;
        }
      });

      /* =======================================================
       STARTUP
       ======================================================= */
      try {
        var savedExplorer = localStorage.getItem("unify.explorer"),
          savedEditor = localStorage.getItem("unify.editor");
        if (savedExplorer)
          document.documentElement.style.setProperty(
            "--explorer-width",
            savedExplorer,
          );
        if (savedEditor)
          document.documentElement.style.setProperty(
            "--editor-width",
            savedEditor,
          );
      } catch (e) {}

      editor.value = project.files[project.current].content;
      renderTree();
      renderTabs();
      updateLineNumbers();
      updateCursorInfo();
      compileCurrent();

      /* Expose a small testable public surface for regression testing. */
      window.UnifyEngine = {
        compile: compileUnify,
        math: evaluateMath,
        style: styleIntent,
        generate: generateCode,
        interpolate: interpolate,
      };
    </script>
  </body>
</html>
